services:
  - type: web
    name: lenscraft-backend
    env: node
    region: singapore
    rootDir: backend
    buildCommand: npm install && npm run setup
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://lenscart.vercel.app
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: BUSINESS_TIMEZONE
        value: Asia/Kolkata
      - key: JWT_SECRET
        generateValue: true
